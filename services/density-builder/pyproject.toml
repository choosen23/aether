[project]
name = "aether-density-builder"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiokafka>=0.12,<0.13",
  "aether-contracts",
  "h3>=4,<5",
  "pydantic>=2.10,<3",
  "prometheus-client>=0.22,<0.24",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_density_builder"]
