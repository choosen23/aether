[project]
name = "aether-simulator"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aether-contracts",
  "pyarrow>=18,<19",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
]

[project.scripts]
aether-sim = "aether_simulator.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_simulator"]
